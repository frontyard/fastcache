name: Tag release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, semver with v prefix (e.g. v1.2.3, v1.0.0-rc.1)"
        required: true
        type: string
      run_checks:
        description: "Run the full CI suite before tagging"
        required: false
        type: boolean
        default: true

permissions:
  contents: write # required to push the tag

jobs:
  checks:
    if: inputs.run_checks
    uses: ./.github/workflows/ci.yml

  tag:
    name: create + push tag
    runs-on: ubuntu-latest
    needs: checks
    if: >-
      always() && !cancelled() &&
      (inputs.run_checks == false || needs.checks.result == 'success')
    steps:
      - uses: actions/checkout@v7

      - name: validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          if ! echo "$TAG" | grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?'; then
            echo "::error::tag '$TAG' is not valid semver (expected e.g. v1.2.3 or v1.0.0-rc.1)"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi

      - name: tag + push
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "${{ github.sha }}"
          git push origin "refs/tags/$TAG"
